    <style>
      html,
      body {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
      }

      html.apc-preloader-lock,
      body.apc-preloader-lock {
        overflow: hidden;
      }

      .apc-preloader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: block;
        background: #000;
        width: 100%;
        max-width: 100vw;
        height: 100vh;
        height: 100dvh;
        height: calc(var(--apc-vh, 1vh) * 100);
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        overflow: hidden;
        overflow-x: clip;
        overscroll-behavior: none;
        transition: opacity 1000ms ease-in-out, visibility 0s linear 1000ms;
        animation: apcPreloaderFadeIn 220ms ease both;
      }

      .apc-preloader.apc-preloader--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .apc-preloader__video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .apc-preloader__scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.25) 0%, rgba(0, 0, 0, 0.55) 70%, rgba(0, 0, 0, 0.7) 100%);
      }

      .apc-preloader__center {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 2;
        pointer-events: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }

      .apc-preloader__logo {
        width: var(--apc-preloader-logo-width, min(52vw, 660px));
        max-width: calc(100vw - 32px);
        height: auto;
        display: block;
        transform-origin: 50% 50%;
        filter: drop-shadow(0 6px 24px rgba(0, 0, 0, 0.4));
        animation: apcPreloaderLogoPulse 1200ms ease-in-out infinite;
      }

      .apc-preloader__hud {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 24px;
        z-index: 3;
        display: grid;
        place-items: center;
        gap: 10px;
        padding: 0 16px;
        pointer-events: none;
      }

      .apc-preloader__countdown {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.92);
      }

      .apc-preloader__countdown strong {
        font-size: 18px;
        letter-spacing: 0.04em;
      }

      @keyframes apcPreloaderLogoPulse {
        0% {
          transform: scale(1);
          opacity: 0.92;
        }
        50% {
          transform: scale(1.035);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 0.92;
        }
      }

      .apc-sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes apcPreloaderFadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .apc-preloader {
          animation: none;
          transition: opacity 120ms ease, visibility 0s linear 120ms;
        }

        .apc-preloader__logo {
          animation: none;
        }
      }

      @media (max-width: 768px) and (orientation: portrait) {
        .apc-preloader__logo {
          width: var(--apc-preloader-logo-width, min(74vw, 460px));
        }
      }

      @media (max-width: 768px) and (orientation: landscape) {
        .apc-preloader__logo {
          width: var(--apc-preloader-logo-width, min(44vw, 340px));
        }
      }

      @media (max-width: 360px) and (orientation: portrait) {
        .apc-preloader__logo {
          width: var(--apc-preloader-logo-width, min(78vw, 420px));
        }
      }
    </style>
    <noscript>
      <style>
        #apc-preloader {
          display: none !important;

  <body>
    <div id="apc-preloader" class="apc-preloader" role="status" aria-live="polite" aria-busy="true">
      <video
        id=""
        class="apc-preloader__video"
        muted
        playsinline
        autoplay
        loop
        preload="metadata"
        disablepictureinpicture
        controlslist="nodownload noplaybackrate noremoteplayback"
        aria-hidden="true"
      >
        <source src="/assets/videos/Sports-Medicine-Video-min-1.mp4" type="video/mp4" />
      </video>
           <div class="apc-preloader__scrim" aria-hidden="true"></div>
      <div class="apc-preloader__center" aria-hidden="true">
        <img
          id="apc-preloader-logo"
          class="apc-preloader__logo"
          src="/assets/apc-branco.svg"
          decoding="async"
          alt=""
        />
      </div>
      <div class="apc-preloader__hud">
        <div class="apc-preloader__countdown" aria-hidden="true">
          <span>Entering in</span>
          <strong id="apc-preloader-count">3</strong>
          <span>s</span>
        </div>
      </div>
      <span class="apc-sr-only">Loading…</span>
    </div>

    <div id="root"></div>
    <script>
      (() => {
        const preloader = document.getElementById("apc-preloader");
        if (!preloader) return;

        const root = document.getElementById("root");
        const countdownEl = document.getElementById("apc-preloader-count");
        const srEl = preloader.querySelector(".apc-sr-only");

        const scheduleViewportUpdate = (() => {
          let rafId = 0;
          return () => {
            if (rafId) return;
            rafId = requestAnimationFrame(() => {
              rafId = 0;
              applyPreloaderViewportSizing();
            });
          };
        })();

        function applyPreloaderViewportSizing() {
          const visualViewport = window.visualViewport;
          const viewportWidth = Math.round((visualViewport?.width ?? window.innerWidth) || 0);
          const viewportHeight = Math.round((visualViewport?.height ?? window.innerHeight) || 0);

          if (viewportWidth) {
            document.documentElement.style.setProperty("--apc-vw", `${viewportWidth}px`);
          }

          if (viewportHeight) {
            document.documentElement.style.setProperty("--apc-vh", `${viewportHeight * 0.01}px`);
          }

          if (viewportWidth && viewportHeight) {
            const isLandscape = viewportWidth > viewportHeight;
            const maxLogoWidth = Math.max(240, Math.min(viewportWidth - 32, isLandscape ? 340 : 460));
            const logoWidth = Math.round(Math.min(maxLogoWidth, viewportWidth * (isLandscape ? 0.44 : 0.74)));
            document.documentElement.style.setProperty("--apc-preloader-logo-width", `${logoWidth}px`);
          }
        }

        function getCookie(name) {
          try {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length !== 2) return null;
            return parts.pop().split(";").shift() || null;
          } catch {
            return null;
          }
        }

        function setCookie(name, value, maxAgeSeconds) {
          try {
            const maxAge = Math.max(0, Math.floor(maxAgeSeconds || 0));
            document.cookie = `${name}=${encodeURIComponent(String(value))}; Path=/; Max-Age=${maxAge}; SameSite=Lax`;
          } catch {}
        }

        function markComplete() {
          try {
            window.__apcPreloaderComplete = true;
            window.dispatchEvent(new Event("apc:preloaderComplete"));
          } catch {}
        }

        function hardRemovePreloader() {
          try {
            if (preloader.parentNode) preloader.parentNode.removeChild(preloader);
          } catch {}
        }

        const pathname = window.location && typeof window.location.pathname === "string" ? window.location.pathname : "/";
        const isHome = pathname === "/" || pathname === "";
        const cookieKey = "apcHomePreloaderUntil";
        const ttlMs = 24 * 60 * 60 * 1000;
        const now = Date.now();

        const cookieUntil = Number(getCookie(cookieKey) || "");
        let storageUntil = 0;
        try {
          storageUntil = Number(window.localStorage.getItem(cookieKey) || "");
        } catch {}

        const alreadySeen = (Number.isFinite(cookieUntil) && cookieUntil > now) || (Number.isFinite(storageUntil) && storageUntil > now);
        const shouldShow = isHome && !alreadySeen;

        if (!shouldShow) {
          markComplete();
          hardRemovePreloader();
          return;
        }

        const until = now + ttlMs;
        setCookie(cookieKey, String(until), ttlMs / 1000);
        try {
          window.localStorage.setItem(cookieKey, String(until));
        } catch {}

        applyPreloaderViewportSizing();
        window.addEventListener("resize", scheduleViewportUpdate, { passive: true });
        window.addEventListener("orientationchange", scheduleViewportUpdate, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", scheduleViewportUpdate, { passive: true });
          window.visualViewport.addEventListener("scroll", scheduleViewportUpdate, { passive: true });
        }

        document.documentElement.classList.add("apc-preloader-lock");
        document.body.classList.add("apc-preloader-lock");

        if (root) {
          root.setAttribute("aria-hidden", "true");
          root.setAttribute("inert", "");
          root.style.opacity = "0";
          root.style.willChange = "opacity";
          try {
            root.inert = true;
          } catch {}
        }

        const startedAt = typeof performance !== "undefined" && performance.now ? performance.now() : Date.now();
        const maxDurationMs = 15000;

        const loadPromise = new Promise((resolve) => {
          if (document.readyState === "complete") resolve();
          else window.addEventListener("load", resolve, { once: true });
        });

        const fontsReadyPromise = (() => {
          try {
            if (document.fonts && document.fonts.ready) return document.fonts.ready.catch(() => undefined);
          } catch {}
          return Promise.resolve();
        })();

        const conn = navigator && navigator.connection ? navigator.connection : null;
        const saveData = Boolean(conn && conn.saveData);
        const effectiveType = conn && typeof conn.effectiveType === "string" ? conn.effectiveType : "";
        const allowHeavy = !saveData && !/2g/.test(effectiveType);

        const urlsToCache = (() => {
          const set = new Set();
          try {
            const styles = Array.from(document.querySelectorAll('link[rel="stylesheet"][href]'));
            styles.forEach((l) => set.add(l.href));
            const scripts = Array.from(document.querySelectorAll('script[type="module"][src]'));
            scripts.forEach((s) => set.add(new URL(s.getAttribute("src"), window.location.origin).toString()));
          } catch {}

          set.add(new URL("/assets/apc-branco.svg", window.location.origin).toString());
          set.add(new URL("/assets/apc-preto.svg", window.location.origin).toString());
          set.add(new URL("/fonts/CircularStd-Book.otf", window.location.origin).toString());
          set.add(new URL("/assets/og-image.jpg", window.location.origin).toString());
          set.add(new URL("/assets/twitter-image.jpg", window.location.origin).toString());

          if (allowHeavy) {
            set.add(new URL("/assets/videos/Sports-Medicine-Video-min-1.mp4", window.location.origin).toString());
            set.add(new URL("/assets/images/illustrative/pain-medicine-algarve-min.jpg", window.location.origin).toString());
            set.add(new URL("/assets/images/illustrative/services-home-min-1.jpg", window.location.origin).toString());
          }

          return Array.from(set);
        })();

        const tasks = {
          domContentLoaded: { weight: 0.8, done: false },
          windowLoad: { weight: 1.0, done: false },
          fontsReady: { weight: 0.6, done: false },
          appMounted: { weight: 1.0, done: false },
          prefetch: { weight: 2.6, done: 0, total: Math.max(1, urlsToCache.length) },
        };

        const computeTotalWeight = () =>
          tasks.domContentLoaded.weight +
          tasks.windowLoad.weight +
          tasks.fontsReady.weight +
          tasks.appMounted.weight +
          tasks.prefetch.weight;

        const computeDoneWeight = () => {
          const prefetchRatio = Math.max(0, Math.min(1, tasks.prefetch.done / tasks.prefetch.total));
          return (
            (tasks.domContentLoaded.done ? tasks.domContentLoaded.weight : 0) +
            (tasks.windowLoad.done ? tasks.windowLoad.weight : 0) +
            (tasks.fontsReady.done ? tasks.fontsReady.weight : 0) +
            (tasks.appMounted.done ? tasks.appMounted.weight : 0) +
            tasks.prefetch.weight * prefetchRatio
          );
        };

        let lastDoneWeight = 0;
        let lastProgressAt = startedAt;
        let smoothedRemainingMs = 6000;
        let lastShownSec = 3;

        const prefetchPromise = (async () => {
          if (!urlsToCache.length) return;

          let cache = null;
          try {
            if (window.caches && typeof window.caches.open === "function") {
              cache = await window.caches.open("apc-preloader-v1");
            }
          } catch {}

          await Promise.allSettled(
            urlsToCache.map(async (u) => {
              try {
                const req = new Request(u, { credentials: "same-origin", cache: "force-cache" });
                if (cache) {
                  const hit = await cache.match(req);
                  if (hit) return;
                }
                const res = await fetch(req);
                if (cache && res && res.ok) {
                  await cache.put(req, res.clone());
                }
              } catch {
              } finally {
                tasks.prefetch.done += 1;
              }
            })
          );
        })();

        if (document.readyState !== "loading") {
          tasks.domContentLoaded.done = true;
        } else {
          window.addEventListener(
            "DOMContentLoaded",
            () => {
              tasks.domContentLoaded.done = true;
            },
            { once: true }
          );
        }

        if (document.readyState === "complete") {
          tasks.windowLoad.done = true;
        } else {
          window.addEventListener(
            "load",
            () => {
              tasks.windowLoad.done = true;
            },
            { once: true }
          );
        }

        fontsReadyPromise.then(() => {
          tasks.fontsReady.done = true;
        });

        const markAppMounted = () => {
          tasks.appMounted.done = true;
        };
        if (window.__apcAppMounted) markAppMounted();
        window.addEventListener("apc:app-mounted", markAppMounted, { once: true });

        const resourceErrorHandler = (event) => {
          try {
            const target = event && event.target ? event.target : null;
            if (!target) return;
            const tag = String(target.tagName || "").toLowerCase();
            if (tag !== "script" && tag !== "link" && tag !== "img") return;
            lastProgressAt = typeof performance !== "undefined" && performance.now ? performance.now() : Date.now();
          } catch {}
        };
        window.addEventListener("error", resourceErrorHandler, true);

        const countdownTimer = window.setInterval(() => {
          const nowMs = typeof performance !== "undefined" && performance.now ? performance.now() : Date.now();
          const totalWeight = computeTotalWeight();
          const doneWeight = computeDoneWeight();

          if (doneWeight > lastDoneWeight + 0.001) {
            lastDoneWeight = doneWeight;
            lastProgressAt = nowMs;
          }

          const elapsed = Math.max(1, nowMs - startedAt);
          const speed = doneWeight > 0.02 ? doneWeight / elapsed : 0;
          const remainingWeight = Math.max(0, totalWeight - doneWeight);

          let estimatedRemaining = speed > 0 ? (remainingWeight / speed) : 8000;
          estimatedRemaining = Math.max(0, Math.min(12000, estimatedRemaining));
          smoothedRemainingMs = smoothedRemainingMs * 0.72 + estimatedRemaining * 0.28;

          const stalled = nowMs - lastProgressAt > 1200 && doneWeight < totalWeight * 0.95;
          const nextSec = Math.max(0, Math.ceil(smoothedRemainingMs / 1000));
          const remainingSec = stalled ? lastShownSec : Math.max(0, Math.min(lastShownSec + 1, Math.max(lastShownSec - 1, nextSec)));
          lastShownSec = remainingSec;

          if (countdownEl) countdownEl.textContent = String(remainingSec);
          if (srEl) srEl.textContent = stalled ? "Loading…" : `Loading… ${remainingSec}s`;

          if (remainingWeight <= 0.02) finishOnce();
        }, 120);

        let finished = false;
        const finishOnce = () => {
          if (finished) return;
          finished = true;
          window.clearInterval(countdownTimer);
          window.removeEventListener("error", resourceErrorHandler, true);
          if (countdownEl) countdownEl.textContent = "0";
          if (srEl) srEl.textContent = "Loading…";
          finish();
        };

        const allAssetsReady = Promise.all([loadPromise, fontsReadyPromise, prefetchPromise]).catch(() => undefined);
        const maxTimer = new Promise((resolve) => window.setTimeout(resolve, maxDurationMs));

        Promise.race([allAssetsReady, maxTimer]).then(() => finishOnce());

        function finish() {
          markComplete();

          if (typeof window.__apcEntranceStart === "function") {
            try {
              window.__apcEntranceStart();
              return;
            } catch {}
          }

          window.setTimeout(hidePreloader, 180);
        }

        function hidePreloader() {
          if (preloader.classList.contains("apc-preloader--hidden")) return;

          if (preloader.getAttribute("data-apc-gsap-done") === "1") {
            document.documentElement.classList.remove("apc-preloader-lock");
            document.body.classList.remove("apc-preloader-lock");

            if (root) {
              root.removeAttribute("aria-hidden");
              root.removeAttribute("inert");
              try {
                root.inert = false;
              } catch {}
            }

            hardRemovePreloader();
            return;
          }

          if (root) {
            root.style.opacity = "";
            root.style.transform = "";
            root.style.transformOrigin = "";
            root.style.willChange = "";
          }

          preloader.classList.add("apc-preloader--hidden");

          document.documentElement.classList.remove("apc-preloader-lock");
          document.body.classList.remove("apc-preloader-lock");

          if (root) {
            root.removeAttribute("aria-hidden");
            root.removeAttribute("inert");
            try {
              root.inert = false;
            } catch {}
          }

          const remove = () => {
            preloader.removeEventListener("transitionend", remove);
            hardRemovePreloader();
          };

          preloader.addEventListener("transitionend", remove);
          window.setTimeout(remove, 1400);
        }

        try {
          window.__apcHidePreloader = hidePreloader;
        } catch {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
